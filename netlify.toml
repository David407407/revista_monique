# Despliegue en Netlify: compila con Vite y publica la carpeta dist.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 8 necesita Node 20.19 o más nuevo
  NODE_VERSION = "22"

# Los archivos de assets llevan un hash en el nombre: se pueden guardar en caché para siempre.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
